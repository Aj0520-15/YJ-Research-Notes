---
layout: default
title: Notes
nav: notes
---
<h1>Notes</h1>
{% if site.posts.size > 0 %}
<ul class="list">
  {% for post in site.posts %}
  <li>
    <span class="d">{{ post.date | date: "%-d %b %Y" }}</span>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </li>
  {% endfor %}
</ul>
{% endif %}
